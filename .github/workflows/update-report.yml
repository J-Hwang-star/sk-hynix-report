name: Update SK Hynix Report

on:
  schedule:
    # 5분 단위 폴링 — GitHub Actions cron 단일/분리 엔트리 모두 큐 밀림/누락 발생 (2026-08-03 확인)
    # 워크플로우 내부에서 마지막 커밋이 50분 이상 지났을 때만 리포트 갱신 (디바운스)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update (skip debounce/market-hours check)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Debounce — skip if last commit < 25 min ago
        id: debounce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -e
          if [ "$FORCE" = "true" ]; then
            echo "Force mode, skipping debounce"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NOW_UTC_MIN=$(( $(date -u +%H) * 60 + $(date -u +%M) ))

          # 장내 시간 (KST 09:00~16:30 = UTC 00:00~07:30): debounce 25분
          # 폐장 후 정리 (KST 17:00~17:30 = UTC 08:00~08:30): debounce 25분, 1회성 갱신
          # 그 외 (KST 17:31~08:59): 스킵 (야간 휴식)
          if [ "$NOW_UTC_MIN" -ge 0 ] && [ "$NOW_UTC_MIN" -le 450 ]; then
            PHASE="market"
          elif [ "$NOW_UTC_MIN" -ge 480 ] && [ "$NOW_UTC_MIN" -le 510 ]; then
            PHASE="afterhours"
          else
            echo "Off-hours (now UTC $(date -u +%H:%M), KST $(date -u -d '+9 hours' +%H:%M)), skipping"
            echo "should_skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Phase: $PHASE (now UTC $(date -u +%H:%M))"

          # 마지막 커밋 시각 (master HEAD)
          LAST_COMMIT_TS=$(git log -1 --format=%ct HEAD)
          NOW_TS=$(date -u +%s)
          ELAPSED=$(( NOW_TS - LAST_COMMIT_TS ))
          ELAPSED_MIN=$(( ELAPSED / 60 ))
          echo "Last commit ${ELAPSED_MIN} min ago"
          if [ "$ELAPSED_MIN" -lt 25 ]; then
            echo "Too soon, skipping (debounce 25min)"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.debounce.outputs.should_skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.debounce.outputs.should_skip != 'true'
        run: |
          pip install --no-cache-dir pandas

      - name: Generate report (retry up to 3)
        if: steps.debounce.outputs.should_skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for i in 1 2 3; do
            echo "Attempt $i"
            python sk_hynix_report.py --months 3 && break
            echo "Attempt $i failed, sleeping 30s..."
            sleep 30
            if [ "$i" = "3" ]; then exit 1; fi
          done

      - name: Verify index.html exists
        if: steps.debounce.outputs.should_skip != 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "index.html not generated" && exit 1
          fi
          echo "index.html size: $(wc -c < index.html) bytes"

      - name: Commit index.html to master
        if: steps.debounce.outputs.should_skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update report (${{ github.run_id }})"
          file_pattern: "index.html"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
