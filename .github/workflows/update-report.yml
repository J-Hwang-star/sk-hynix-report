name: Update SK Hynix Report

on:
  schedule:
    # 월~금 KST 09:10~15:10 = UTC 00:10~06:10 (장중 1시간마다)
    - cron: "10 0 * * 1-5"
    - cron: "10 1 * * 1-5"
    - cron: "10 2 * * 1-5"
    - cron: "10 3 * * 1-5"
    - cron: "10 4 * * 1-5"
    - cron: "10 5 * * 1-5"
    - cron: "10 6 * * 1-5"
    # 월~금 KST 16:10 = UTC 07:10 (장 마감 후 최종)
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir pandas

      - name: Generate report (retry up to 3)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for i in 1 2 3; do
            echo "Attempt $i"
            python sk_hynix_report.py --months 3 && break
            echo "Attempt $i failed, sleeping 30s..."
            sleep 30
            if [ "$i" = "3" ]; then exit 1; fi
          done

      - name: Verify index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html not generated" && exit 1
          fi
          echo "index.html size: $(wc -c < index.html) bytes"

      - name: Commit index.html to master
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update report (${{ github.run_id }})"
          file_pattern: "index.html"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
